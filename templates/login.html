{% extends "base.html" %}

{% block title %}Login - AutoShare{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-sm">
        <div class="mb-6">
            <h1 class="text-xl font-bold text-white">Student Login</h1>
            <p class="text-xs text-gray-400 mt-1">Enter your college email to receive a one-time code.</p>
        </div>

        {% if error %}
        <div class="mb-4 bg-red-500/10 border border-red-500/30 text-red-300 text-sm px-4 py-3 rounded-xl">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">College Email</label>
                <input type="email" name="email" value="{{ email or '' }}" placeholder="you@iiitkottayam.ac.in" required
                       autocomplete="email"
                       class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-3 rounded-xl transition-colors text-sm shadow-lg shadow-emerald-900/20">
                Send login code
            </button>
        </form>

        <p class="text-sm text-gray-400 text-center mt-5">
            New here?
            <a href="/register" class="text-emerald-400 hover:text-emerald-300 font-medium">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
