<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoShare{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <div class="flex items-center gap-4 shrink-0">
                <a href="/" class="text-xl font-bold tracking-tight text-emerald-400 flex items-center gap-2">
                    🛺 <span>AutoShare</span>
                </a>
                <a href="/about" class="text-xs text-gray-400 hover:text-emerald-400 transition-colors">About</a>
            </div>
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <span class="text-xs bg-gray-700 px-2.5 py-1 rounded-full text-gray-300 border border-gray-600 hidden md:inline">
                    IIIT Kottayam Campus Hub
                </span>
                {% if current_user %}
                <span class="text-xs text-gray-400 truncate max-w-[9rem] sm:max-w-[14rem]" title="{{ current_user.email }}">{{ current_user.username }}</span>
                <form action="/logout" method="post">
                    <button type="submit" class="text-xs bg-gray-700 hover:bg-gray-600 border border-gray-600 text-gray-200 px-3 py-1.5 rounded-lg transition-colors">
                        Logout
                    </button>
                </form>
                <form action="/logout-all" method="post" onsubmit="return confirm('Sign out on all devices?');">
                    <button type="submit" class="text-xs bg-gray-700 hover:bg-red-500/80 border border-gray-600 text-gray-200 px-3 py-1.5 rounded-lg transition-colors hidden sm:inline">
                        Logout all
                    </button>
                </form>
                {% else %}
                <a href="/login" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-semibold px-3 py-1.5 rounded-lg transition-colors">
                    Log in
                </a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-xs text-gray-500">
        <p>&copy; 2026 AutoShare Portal. Built for seamless student transit.</p>
    </footer>

</body>
</html>
