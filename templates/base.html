<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoShare{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navigation Bar -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight text-emerald-400 flex items-center gap-2">
                🛺 <span>AutoShare</span>
            </a>
            <div class="flex items-center gap-4">
                <span class="text-xs bg-gray-700 px-2.5 py-1 rounded-full text-gray-300 border border-gray-600 hidden sm:inline">
                    IIIT Kottayam Campus Hub
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Dynamic Window -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6">
        {% block content %}
        <!-- Child templates (index.html, create.html) will inject their UI blocks here -->
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-4 text-center text-xs text-gray-500">
        <p>&copy; 2026 AutoShare Portal. Built for seamless student transit.</p>
    </footer>

</body>
</html>
