{% extends "base.html" %}

{% block title %}Verify code - AutoShare{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-sm">
        <div class="mb-6">
            <h1 class="text-xl font-bold text-white">Enter verification code</h1>
            <p class="text-xs text-gray-400 mt-1">We sent a 6-digit code to <span class="text-emerald-400">{{ email }}</span>. It expires in 10 minutes.</p>
        </div>

        {% if error %}
        <div class="mb-4 bg-red-500/10 border border-red-500/30 text-red-300 text-sm px-4 py-3 rounded-xl">
            {{ error }}
        </div>
        {% endif %}

        <form action="/verify-otp" method="post" class="space-y-4">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="purpose" value="{{ purpose }}">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">One-time code</label>
                <input type="text" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required
                       autocomplete="one-time-code" placeholder="••••••"
                       class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white text-center tracking-[0.4em] placeholder-gray-600 focus:outline-none focus:border-emerald-500 text-lg">
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-3 rounded-xl transition-colors text-sm shadow-lg shadow-emerald-900/20">
                Verify and continue
            </button>
        </form>

        <form action="/resend-otp" method="post" class="mt-4">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="purpose" value="{{ purpose }}">
            <button type="submit" class="w-full text-sm text-gray-400 hover:text-emerald-400 transition-colors py-2">
                Resend code
            </button>
        </form>

        <p class="text-sm text-gray-500 text-center mt-4">
            <a href="{% if purpose == 'signup' %}/register{% else %}/login{% endif %}" class="text-gray-400 hover:text-emerald-400">Back</a>
        </p>
    </div>
</div>
{% endblock %}
