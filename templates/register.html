{% extends "base.html" %}

{% block title %}Register - AutoShare{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-sm">
        <div class="mb-6">
            <h1 class="text-xl font-bold text-white">Create Account</h1>
            <p class="text-xs text-gray-400 mt-1">Use your @iiitkottayam.ac.in email. We'll send a one-time code.</p>
        </div>

        {% if error %}
        <div class="mb-4 bg-red-500/10 border border-red-500/30 text-red-300 text-sm px-4 py-3 rounded-xl">
            {{ error }}
        </div>
        {% endif %}

        <form action="/register" method="post" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">College Email</label>
                <input type="email" name="email" value="{{ email or '' }}" placeholder="you@iiitkottayam.ac.in" required
                       autocomplete="email"
                       class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Gender</label>
                <div class="flex gap-3">
                    <label class="flex-1 flex items-center justify-center gap-2 bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm cursor-pointer has-[:checked]:border-emerald-500 has-[:checked]:text-emerald-400">
                        <input type="radio" name="gender" value="male" required
                               {% if gender == 'male' or not gender %}checked{% endif %}
                               class="accent-emerald-500">
                        Male
                    </label>
                    <label class="flex-1 flex items-center justify-center gap-2 bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm cursor-pointer has-[:checked]:border-emerald-500 has-[:checked]:text-emerald-400">
                        <input type="radio" name="gender" value="female" required
                               {% if gender == 'female' %}checked{% endif %}
                               class="accent-emerald-500">
                        Female
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Mobile Number</label>
                <input type="tel" name="phone" value="{{ phone or '' }}" placeholder="10-digit mobile" required
                       maxlength="14" autocomplete="tel"
                       class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 text-sm">
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold py-3 rounded-xl transition-colors text-sm shadow-lg shadow-emerald-900/20">
                Send verification code
            </button>
        </form>

        <p class="text-sm text-gray-400 text-center mt-5">
            Already have an account?
            <a href="/login" class="text-emerald-400 hover:text-emerald-300 font-medium">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
